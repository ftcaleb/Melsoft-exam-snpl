<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melsoft Fundamentals Exam</title>
<style>
  :root {
    --primary: #ffffff;
    --secondary: #0e1a38;
    --secondary-soft: #1c2b52;
    --secondary-tint: #e8ebf3;
    --border: #d6dae4;
    --muted: #6b7280;
    --text: #0e1a38;
    --accent: #2f4bd3;
    --success: #16a34a;
    --success-tint: #dcfce7;
    --amber: #d97706;
    --amber-tint: #fef3c7;
    --danger: #dc2626;
    --danger-tint: #fee2e2;
    --code-bg: #f5f6fa;
    --shadow: 0 8px 24px rgba(14,26,56,0.06);
  }
  [data-theme="dark"] {
    --primary: #0b1428;
    --secondary: #e8ebf3;
    --secondary-soft: #cbd2e1;
    --secondary-tint: #1c2b52;
    --border: #2a3554;
    --muted: #96a0bb;
    --text: #e8ebf3;
    --code-bg: #101a34;
    --shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --primary: #0b1428;
      --secondary: #e8ebf3;
      --secondary-soft: #cbd2e1;
      --secondary-tint: #1c2b52;
      --border: #2a3554;
      --muted: #96a0bb;
      --text: #e8ebf3;
      --code-bg: #101a34;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--primary);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--primary);
    color: var(--text);
    padding: 10px 16px;
    font-weight: 500;
    transition: transform .05s ease, background .15s ease, border-color .15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--secondary); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary {
    background: var(--secondary);
    color: var(--primary);
    border-color: var(--secondary);
  }
  button.primary:hover:not(:disabled) { background: var(--secondary-soft); border-color: var(--secondary-soft); }
  button.ghost { background: transparent; }
  button.danger { background: var(--danger); color: white; border-color: var(--danger); }
  input[type=text], input[type=email], textarea {
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    width: 100%;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, textarea:focus {
    border-color: var(--secondary);
    box-shadow: 0 0 0 3px rgba(14,26,56,0.08);
  }
  textarea { resize: vertical; min-height: 120px; line-height: 1.55; }
  textarea.code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 13.5px;
    background: var(--code-bg);
    border-color: var(--border);
    min-height: 180px;
    tab-size: 2;
    -moz-tab-size: 2;
    white-space: pre;
    overflow-wrap: normal;
    overflow-x: auto;
  }
  a { color: var(--secondary); }

  /* App shell */
  .app { max-width: 100%; margin: 0 auto; padding: 0; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--primary);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--secondary); font-size: 16px; letter-spacing: -0.01em; }
  .brand .logo {
    width: 28px; height: 28px; border-radius: 6px; background: var(--secondary);
    color: var(--primary); display: grid; place-items: center; font-size: 12px; font-weight: 800;
  }
  .top-right { display: flex; align-items: center; gap: 16px; }
  .timer {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--secondary-tint);
    color: var(--secondary);
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .timer.warn { background: var(--amber-tint); color: var(--amber); }
  .timer.crit { background: var(--danger-tint); color: var(--danger); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .7; } }

  /* Screens */
  .screen { padding: 32px 24px; max-width: 1100px; margin: 0 auto; }
  .screen h1 { font-size: 26px; margin: 0 0 8px; color: var(--secondary); letter-spacing: -0.02em; }
  .screen h2 { font-size: 18px; margin: 24px 0 8px; color: var(--secondary); }
  .screen p { margin: 8px 0 12px; color: var(--text); }
  .muted { color: var(--muted); }

  /* Landing */
  .landing { max-width: 560px; margin: 60px auto; padding: 32px; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); background: var(--primary); }
  .landing h1 { text-align: center; }
  .landing .field { margin: 16px 0; }
  .landing label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
  .landing .rules { background: var(--secondary-tint); border-radius: 10px; padding: 16px; margin: 20px 0; font-size: 14px; }
  .landing .rules ul { margin: 8px 0 0; padding-left: 20px; }
  .landing .rules li { margin: 4px 0; }
  .landing .start-btn { width: 100%; padding: 14px; font-size: 15px; margin-top: 8px; }

  /* Exam layout */
  .exam-layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 800px) { .exam-layout { grid-template-columns: 1fr; } }

  .side { position: sticky; top: 72px; align-self: flex-start; border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: var(--primary); max-height: calc(100vh - 92px); overflow-y: auto; }
  .side h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .qgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 16px; }
  .qbtn {
    padding: 8px 0;
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--primary);
    color: var(--text);
    cursor: pointer;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    position: relative;
  }
  .qbtn.answered { background: var(--success-tint); border-color: var(--success); color: var(--success); }
  .qbtn.flagged { background: var(--amber-tint); border-color: var(--amber); color: var(--amber); }
  .qbtn.answered.flagged {
    background: linear-gradient(135deg, var(--success-tint) 50%, var(--amber-tint) 50%);
  }
  .qbtn.current { outline: 2px solid var(--secondary); outline-offset: 2px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 12px 0 6px; font-weight: 700; }
  .legend { font-size: 12px; color: var(--muted); }
  .legend-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); }
  .legend-dot.a { background: var(--success-tint); border-color: var(--success); }
  .legend-dot.f { background: var(--amber-tint); border-color: var(--amber); }

  /* Question view */
  .qview { border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px; background: var(--primary); box-shadow: var(--shadow); }
  .qmeta { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; font-size: 12px; }
  .qmeta .badge { background: var(--secondary); color: var(--primary); padding: 3px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.02em; }
  .qmeta .kind { color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; font-size: 11px; }
  .qtitle { font-size: 20px; margin: 6px 0 4px; color: var(--secondary); }
  .qprompt { font-size: 15px; margin: 8px 0 20px; white-space: pre-wrap; }
  .qprompt code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 0.92em; }
  .qbody { margin-top: 12px; }
  .codeblock {
    background: var(--code-bg);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: ui-monospace, monospace;
    font-size: 13.5px;
    white-space: pre;
    overflow-x: auto;
    margin: 8px 0 16px;
    border: 1px solid var(--border);
    line-height: 1.6;
  }

  /* IDE */
  .ide { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 10px; }
  .ide-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--secondary-tint); border-bottom: 1px solid var(--border); font-size: 13px; }
  .ide-head .label { font-weight: 600; color: var(--secondary); }
  .ide-actions { display: flex; gap: 6px; }
  .ide-actions button { padding: 5px 10px; font-size: 12px; }
  .ide textarea.code { border: none; border-radius: 0; min-height: 220px; margin: 0; display: block; }
  .console {
    background: var(--secondary);
    color: #cbd2e1;
    font-family: ui-monospace, monospace;
    font-size: 12.5px;
    padding: 10px 14px;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    border-top: 1px solid var(--border);
    display: none;
  }
  .console.open { display: block; }
  .console .line { padding: 2px 0; }
  .console .log { color: #cbd2e1; }
  .console .warn { color: #fbbf24; }
  .console .error { color: #f87171; }
  .console .info { color: #7dd3fc; }
  .console .empty { color: #6b7280; font-style: italic; }

  /* Nav row */
  .nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; gap: 12px; flex-wrap: wrap; }
  .nav-left, .nav-right { display: flex; gap: 8px; }
  .flag-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

  /* Review */
  .review-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  .review-table th, .review-table td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; }
  .review-table th { background: var(--secondary-tint); color: var(--secondary); font-weight: 600; font-size: 13px; }
  .review-table .num { width: 40px; font-weight: 700; }
  .review-table .status { width: 90px; }
  .review-table .actions { width: 80px; text-align: right; }
  .review-answer { color: var(--muted); font-size: 13px; max-height: 60px; overflow: hidden; text-overflow: ellipsis; white-space: pre-wrap; }
  .status-pill { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .status-pill.a { background: var(--success-tint); color: var(--success); }
  .status-pill.u { background: var(--danger-tint); color: var(--danger); }
  .status-pill.f { background: var(--amber-tint); color: var(--amber); }

  /* Submitted */
  .submitted { text-align: center; max-width: 620px; margin: 60px auto; padding: 40px; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); background: var(--primary); }
  .submitted .check { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: var(--success-tint); color: var(--success); display: grid; place-items: center; font-size: 32px; }
  .submitted h1 { color: var(--success); }
  .score-big { font-size: 40px; font-weight: 800; color: var(--secondary); margin: 12px 0 4px; font-variant-numeric: tabular-nums; }
  .score-max { color: var(--muted); font-size: 16px; }

  /* Admin */
  .admin-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .admin-table { width: 100%; border-collapse: collapse; }
  .admin-table th, .admin-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .admin-table th { background: var(--secondary-tint); color: var(--secondary); font-weight: 600; font-size: 13px; }
  .admin-table tr.clickable { cursor: pointer; }
  .admin-table tr.clickable:hover { background: var(--secondary-tint); }
  .empty-state { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; }

  /* Marking detail */
  .mark-detail { border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 16px; background: var(--primary); }
  .mark-q { border-bottom: 1px solid var(--border); padding: 16px 0; }
  .mark-q:last-child { border-bottom: none; }
  .mark-q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .mark-q-title { font-weight: 700; color: var(--secondary); }
  .mark-q-prompt { font-size: 13.5px; color: var(--muted); margin-bottom: 8px; }
  .mark-q-answer { background: var(--code-bg); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; margin: 8px 0; }
  .mark-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .score-input { width: 80px; }
  .feedback-input { flex: 1; min-width: 200px; }
  .mark-score-tag { padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 13px; }
  .mark-score-tag.good { background: var(--success-tint); color: var(--success); }
  .mark-score-tag.mid { background: var(--amber-tint); color: var(--amber); }
  .mark-score-tag.poor { background: var(--danger-tint); color: var(--danger); }
  .marking-note { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; }
  .automark-msg { font-size: 13px; color: var(--secondary); background: var(--secondary-tint); padding: 10px 12px; border-radius: 8px; margin: 10px 0; }

  /* Modal */
  .backdrop { position: fixed; inset: 0; background: rgba(14,26,56,0.5); display: none; z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .backdrop.open { display: flex; }
  .modal { background: var(--primary); border-radius: 12px; padding: 28px; max-width: 480px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h2 { margin-top: 0; color: var(--secondary); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  .helper { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* Admin */
  .admin-login-card { max-width: 420px; margin: 80px auto; padding: 32px; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); background: var(--primary); }
  .admin-login-card h1 { font-size: 22px; margin: 0 0 6px; color: var(--secondary); text-align: center; }
  .admin-login-card .sub { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .admin-login-card .field { margin: 14px 0; }
  .admin-login-card label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
  .admin-login-card .submit { width: 100%; padding: 12px; font-size: 15px; margin-top: 8px; }
  .admin-login-card .err { background: var(--danger-tint); color: var(--danger); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .admin-header h1 { margin: 0 0 4px; font-size: 22px; color: var(--secondary); }
  .admin-header .who { font-size: 13px; color: var(--muted); }
  .admin-table { width: 100%; border-collapse: collapse; background: var(--primary); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .admin-table th, .admin-table td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .admin-table th { background: var(--secondary-tint); color: var(--secondary); font-weight: 600; font-size: 13px; }
  .admin-table tr:last-child td { border-bottom: none; }
  .admin-table tr.clickable { cursor: pointer; }
  .admin-table tr.clickable:hover td { background: var(--secondary-tint); }
  .empty-state { padding: 40px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; background: var(--primary); }
  .mark-detail { border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-top: 16px; background: var(--primary); }
  .mark-q { border-bottom: 1px solid var(--border); padding: 18px 0; }
  .mark-q:first-child { padding-top: 4px; }
  .mark-q:last-child { border-bottom: none; }
  .mark-q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .mark-q-title { font-weight: 700; color: var(--secondary); }
  .mark-q-prompt { font-size: 13.5px; color: var(--muted); margin: 4px 0 10px; }
  .mark-q-answer { background: var(--code-bg); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; margin: 8px 0; max-height: 260px; overflow: auto; }
  .mark-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .score-input { width: 80px; }
  .feedback-input { flex: 1; min-width: 200px; }
  .mark-score-tag { padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 13px; }
  .mark-score-tag.good { background: var(--success-tint); color: var(--success); }
  .mark-score-tag.mid  { background: var(--amber-tint); color: var(--amber); }
  .mark-score-tag.poor { background: var(--danger-tint); color: var(--danger); }
  .notes-block { margin-top: 16px; }
  .notes-block textarea { min-height: 90px; }
  .save-bar { position: sticky; bottom: 0; margin-top: 16px; padding: 14px 16px; background: var(--primary); border: 1px solid var(--border); border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 -4px 12px rgba(14,26,56,0.06); flex-wrap: wrap; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--secondary); color: white; padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity .2s ease; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app" id="app">
  <div id="root"></div>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal" id="modal"></div>
</div>

<script>
"use strict";

/* ============================================================
   QUESTIONS
   ============================================================ */
const QUESTIONS = [
  // -------- SECTION A: FRONTEND --------
  { id: 'a1', section: 'A', number: 1, kind: 'Definition', type: 'text',
    title: 'Question 1',
    prompt: "What is the DOM (Document Object Model)? Answer in your own words in two or three sentences.",
    marks: 3,
    rubric: "Full credit if the answer identifies (a) the DOM as a programmatic/tree representation of an HTML (or XML) document, and (b) that JavaScript uses it to read and modify page content. Partial credit for one of the two." },

  { id: 'a2', section: 'A', number: 2, kind: 'Short Answer', type: 'text',
    title: 'Question 2',
    prompt: "Explain the difference between let, const, and var in JavaScript. When would you choose each?",
    marks: 4,
    rubric: "Full credit if the answer covers: var is function-scoped and hoisted; let is block-scoped and re-assignable; const is block-scoped and cannot be re-assigned (though object contents can mutate). One mark per accurate distinction, one for a reasonable guidance on when to choose each." },

  { id: 'a3', section: 'A', number: 3, kind: 'Code Completion', type: 'code',
    title: 'Question 3',
    prompt: "Complete the code below so that it sends the object { email: 'test@example.com' } as JSON to /api/otp/send using a POST request. Fill in the three blanks.",
    starter: "fetch('/api/otp/send', {\n  method: '___',\n  headers: { '___': 'application/json' },\n  body: ___\n});",
    marks: 3,
    rubric: "1 mark for method: 'POST'. 1 mark for header key 'Content-Type'. 1 mark for body: JSON.stringify({ email: 'test@example.com' }). Accept minor case/whitespace variations." },

  { id: 'a4', section: 'A', number: 4, kind: 'Short Answer', type: 'text',
    title: 'Question 4',
    prompt: "The CSS box model has four parts that surround an element's content. Name all four and briefly describe what each one does.",
    marks: 4,
    rubric: "1 mark each for: content (the actual content area), padding (space inside the border), border (the line around the padding), margin (space outside the border, separating from other elements)." },

  { id: 'a5', section: 'A', number: 5, kind: 'Code Completion', type: 'code',
    title: 'Question 5',
    prompt: "Given the HTML element <button id=\"submit-btn\">Submit</button>, write the JavaScript that attaches a click handler to the button. The handler should log the string \"Clicked!\" to the console.",
    starter: "// Write your code here\n",
    marks: 3,
    rubric: "Full credit for: document.getElementById('submit-btn').addEventListener('click', () => console.log('Clicked!')); Also accept querySelector, function expressions, onclick property. Deduct for missing quotes/parens." },

  { id: 'a6', section: 'A', number: 6, kind: 'Debugging', type: 'code',
    title: 'Question 6',
    prompt: "The developer expected the code below to print 'Ada', 'Grace', 'Katherine' (in some order). Instead it prints 'undefined' three times. What is wrong, and how would you fix it? Write your corrected version below and briefly explain the bug in a comment.",
    starter: "const users = ['Ada', 'Grace', 'Katherine'];\nfor (var i = 0; i < users.length; i++) {\n  setTimeout(function() {\n    console.log(users[i]);\n  }, 100);\n}\n\n// Your fix and explanation:\n",
    marks: 4,
    rubric: "2 marks for identifying the closure issue (var is function-scoped, so all callbacks share the same i, which is 3 by the time they run — beyond the array). 2 marks for the fix (change var to let, OR wrap in an IIFE, OR use forEach). Explanation must be technically accurate." },

  { id: 'a7', section: 'A', number: 7, kind: 'Short Answer', type: 'text',

/* ============================================================
   BOOT — no artifact capabilities in the standalone build
   ============================================================ */
async function bootCapabilities() {
  // Nothing to boot in standalone mode. Function kept so the rest of the code doesn't change.
  return;
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveLocal() {
  try {
    const payload = {
      student: state.student,
      startedAt: state.startedAt,
      answers: state.answers,
      flags: state.flags,
      currentIdx: state.currentIdx,
      screen: state.screen === 'submitted' ? 'submitted' : (state.startedAt ? 'exam' : 'landing'),
    };
    localStorage.setItem(CONFIG.localKey, JSON.stringify(payload));
  } catch(e) { /* storage unavailable — carry on */ }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(CONFIG.localKey);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}
function clearLocal() {
  try { localStorage.removeItem(CONFIG.localKey); } catch(e) {}
}

/* ============================================================
   HELPERS
   ============================================================ */
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function currentQuestion() {
  return QUESTIONS[state.currentIdx];
}
function isAnswered(qid) {
  const v = state.answers[qid];
  return v != null && v.trim().length > 0 && v.trim() !== (QUESTIONS.find(q=>q.id===qid).starter || '').trim();
}
function timeUsedSec() {
  if (!state.startedAt) return 0;
  const end = state.submittedAt || Date.now();
  return Math.floor((end - state.startedAt) / 1000);
}
function timeRemainingSec() {
  return CONFIG.durationSec - timeUsedSec();
}

/* ============================================================
   TIMER
   ============================================================ */
function startTimer() {
  if (state.timerHandle) clearInterval(state.timerHandle);
  state.timerHandle = setInterval(() => {
    updateTimer();
    if (timeRemainingSec() <= 0 && !state.timerExpired) {
      state.timerExpired = true;
      clearInterval(state.timerHandle);
      state.timerHandle = null;
      autoSubmit();
    }
  }, 1000);
  updateTimer();
}
function updateTimer() {
  const t = document.getElementById('timer');
  if (!t) return;
  const rem = timeRemainingSec();
  t.textContent = fmtTime(rem);
  t.classList.remove('warn','crit');
  if (rem <= 60) t.classList.add('crit');
  else if (rem <= 300) t.classList.add('warn');
}
function stopTimer() {
  if (state.timerHandle) { clearInterval(state.timerHandle); state.timerHandle = null; }
}

/* ============================================================
   NAVIGATION / ROUTING
   ============================================================ */
function navigate(screen) {
  state.screen = screen;
  saveLocal();
  render();
}
function goToQuestion(idx) {
  if (idx < 0 || idx >= QUESTIONS.length) return;
  saveCurrentAnswer();
  state.currentIdx = idx;
  saveLocal();
  render();
}
function saveCurrentAnswer() {
  const q = currentQuestion();
  if (!q) return;
  const ta = document.getElementById('answer-textarea');
  if (ta) state.answers[q.id] = ta.value;
  saveLocal();
}

/* ============================================================
   RENDER (main dispatcher)
   ============================================================ */
function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';

  switch (state.screen) {
    case 'landing':        renderLanding(root); break;
    case 'exam':           renderExam(root); break;
    case 'review':         renderReview(root); break;
    case 'submitting':     renderSubmitting(root); break;
    case 'submitted':      renderSubmitted(root); break;
    case 'submit_failed':  renderSubmitFailed(root); break;
    case 'admin_login':    renderAdminLogin(root); break;
    case 'admin_list':     renderAdminList(root); break;
    case 'admin_detail':   renderAdminDetail(root); break;
    default:               renderLanding(root);
  }
}

/* ============================================================
   TOPBAR
   ============================================================ */
function topbar(opts = {}) {
  const showTimer = opts.timer !== false && state.startedAt && state.screen !== 'submitted' && state.screen !== 'submit_failed';
  const timer = showTimer ? '<span class="timer" id="timer">' + fmtTime(timeRemainingSec()) + '</span>' : '';
  return el(
    '<div class="topbar">' +
      '<div class="brand"><span class="logo">M</span><span>Melsoft Fundamentals Exam</span></div>' +
      '<div class="top-right">' + timer + '</div>' +
    '</div>'
  );
}

function startExam() {
  const name = document.getElementById('in-name').value.trim();
  const email = document.getElementById('in-email').value.trim();
  if (!name) { alert("Please enter your name."); return; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert("Please enter a valid email."); return; }
  state.student = { name, email };
  state.startedAt = Date.now();
  state.answers = {};
  state.flags = {};
  state.currentIdx = 0;
  state.screen = 'exam';
  saveLocal();
  startTimer();
  render();
}

/* ============================================================
   EXAM VIEW
   ============================================================ */

    + '</div>'
    + '<h2 class="qtitle">' + esc(q.title) + '</h2>'
    + '<div class="qprompt">' + esc(q.prompt) + '</div>'
    + '<div class="qbody" id="qbody"></div>'

    +   '<div class="nav-left">'
    +     '<button id="btn-prev" ' + (state.currentIdx === 0 ? 'disabled' : '') + '>&larr; Previous</button>'
    +   '</div>'
    +   '<label class="flag-check"><input type="checkbox" id="flag-cb" ' + (state.flags[q.id] ? 'checked' : '') + '> Flag for review</label>'
    +   '<div class="nav-right">'
    +     (state.currentIdx === QUESTIONS.length - 1

    if (state.flags[qq.id]) b.classList.add('flagged');

    g.appendChild(b);

  // Question body: textarea or IDE

  if (q.type === 'text') {
    const ta = document.createElement('textarea');

    ta.placeholder = "Type your answer here…";
    ta.rows = 8;

    ta.addEventListener('input', onAnswerInput);

          '<span class="label">JavaScript editor</span>' +

function rerenderGrid() {
  QUESTIONS.forEach((qq, i) => {
    const grid = document.getElementById(qq.section === 'A' ? 'qgrid-a' : 'qgrid-b');
    if (!grid) return;
    const btn = grid.children[qq.section === 'A' ? i : i - 10];
    if (!btn) return;
    btn.className = 'qbtn';
    if (isAnswered(qq.id)) btn.classList.add('answered');
    if (state.flags[qq.id]) btn.classList.add('flagged');
    if (i === state.currentIdx) btn.classList.add('current');
  });
}

function onAnswerInput() {
  const q = currentQuestion();
  const ta = document.getElementById('answer-textarea');
  state.answers[q.id] = ta.value;
  saveLocal();
  rerenderGrid();
}

function tabHandler(e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  const ta = e.target;
  const s = ta.selectionStart, en = ta.selectionEnd;
  const before = ta.value.substring(0, s);
  const after = ta.value.substring(en);
  ta.value = before + '  ' + after;
  ta.selectionStart = ta.selectionEnd = s + 2;
  onAnswerInput();
}

/* ============================================================
   CODE RUNNER (sandboxed iframe)
   ============================================================ */
function runCode() {
  const ta = document.getElementById('answer-textarea');
  const code = ta.value;
  const cons = document.getElementById('console');
  cons.classList.add('open');
  cons.innerHTML = '';
  const appendLine = (kind, args) => {
    const line = document.createElement('div');
    line.className = 'line ' + kind;
    line.textContent = args.map(a => {
      if (typeof a === 'string') return a;
      try { return JSON.stringify(a, null, 2); } catch(e) { return String(a); }
    }).join(' ');
    cons.appendChild(line);
    cons.scrollTop = cons.scrollHeight;
  };

  // Build a sandboxed iframe
  const iframe = document.createElement('iframe');
  iframe.sandbox = 'allow-scripts';
  iframe.style.display = 'none';

  const html =
    '<!doctype html><html><body><script>' +
    '(function(){' +
      'function send(kind,args){parent.postMessage({__mel:true,kind:kind,args:args},"*");}' +
      'var _c=console;' +
      'console={' +
        'log:function(){send("log",Array.prototype.slice.call(arguments).map(function(a){try{return JSON.parse(JSON.stringify(a));}catch(e){return String(a);}}));},' +
        'warn:function(){send("warn",Array.prototype.slice.call(arguments).map(String));},' +
        'error:function(){send("error",Array.prototype.slice.call(arguments).map(String));},' +
        'info:function(){send("info",Array.prototype.slice.call(arguments).map(String));},' +
      '};' +
      'window.onerror=function(msg,src,line,col){send("error",["Error: "+msg+" (line "+line+")"]);return true;};' +
      'window.onunhandledrejection=function(ev){send("error",["Unhandled promise rejection: "+(ev.reason&&ev.reason.message||ev.reason)]);};' +
      'try{' +
        'new Function(' + JSON.stringify(code) + ')();' +
      '}catch(e){send("error",["Error: "+(e.message||e)]);}' +
      'setTimeout(function(){send("__done",[]);},1500);' +
    '})();' +
    '</' + 'script></body></html>';

  iframe.srcdoc = html;

  let done = false;
  let usedFallback = false;
  const cleanup = () => {
    if (done) return;
    done = true;
    window.removeEventListener('message', handler);
    if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
    if (cons.childElementCount === 0) {
      cons.innerHTML = '<div class="empty">Code ran with no console output.</div>';
    }
  };
  const handler = (ev) => {
    const d = ev.data;
    if (!d || !d.__mel) return;
    if (d.kind === '__done') { cleanup(); return; }
    appendLine(d.kind, d.args);
  };
  window.addEventListener('message', handler);

  try { document.body.appendChild(iframe); } catch(e) { /* fall through */ }

  // Fallback: if 500ms pass and we've heard nothing (iframe blocked), run in main context.
  setTimeout(() => {
    if (done) return;
    // Detect whether iframe never loaded
    let loaded = false;
    try { loaded = iframe.contentDocument !== null; } catch(e) { loaded = true; /* cross-origin means it did load */ }
    if (loaded && cons.childElementCount > 0) return; // iframe is producing output, wait for done
    // Assume blocked — run via Function() with a proxied console
    usedFallback = true;
    window.removeEventListener('message', handler);
    if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
    const savedConsole = window.console;
    const proxy = {
      log:   function(){ appendLine('log',   Array.prototype.slice.call(arguments)); },
      warn:  function(){ appendLine('warn',  Array.prototype.slice.call(arguments)); },
      error: function(){ appendLine('error', Array.prototype.slice.call(arguments)); },
      info:  function(){ appendLine('info',  Array.prototype.slice.call(arguments)); },
    };
    try {
      new Function('console', code)(proxy);
    } catch(e) {
      appendLine('error', ['Error: ' + (e && e.message || e)]);
    }
    setTimeout(() => {
      if (cons.childElementCount === 0) {
        cons.innerHTML = '<div class="empty">Code ran with no console output.</div>';
      }
      done = true;
    }, 800);
  }, 500);
}

/* ============================================================
   SUBMIT — POSTs to Google Apps Script webhook
   ============================================================ */
async function doSubmit(auto) {
  stopTimer();
  saveCurrentAnswer();
  state.submittedAt = Date.now();

  const answers = {};
  QUESTIONS.forEach(q => { answers[q.id] = state.answers[q.id] || ''; });

  // Trim rubric out of what we send — the server doesn't need it.
  const questionsMeta = QUESTIONS.map(q => ({
    id: q.id, section: q.section, number: q.number, kind: q.kind, marks: q.marks, prompt: q.prompt
  }));

  const payload = {
    studentName: state.student.name,
    studentEmail: state.student.email,
    startedAt: new Date(state.startedAt).toISOString(),
    submittedAt: new Date(state.submittedAt).toISOString(),
    timeUsedSec: timeUsedSec(),
    autoSubmitted: !!auto,
    answers: answers,
    questions: questionsMeta,
    maxScore: CONFIG.maxScore,
  };

  state.pendingPayload = payload;

  // Show submitting state
  state.screen = 'submitting';
  render();

  if (!CONFIG.submitUrl || CONFIG.submitUrl === "PASTE_YOUR_WEBHOOK_URL_HERE") {
    state.submitError = "This exam has not been configured yet. The submit URL is missing. Please contact your instructor.";
    state.screen = 'submit_failed';
    render();
    return;
  }

  try {
    // Use text/plain body to avoid a CORS preflight (Google Apps Script cannot answer OPTIONS).
    const res = await fetch(CONFIG.submitUrl, {
      method: 'POST',
      body: JSON.stringify(payload),
      // NOTE: no Content-Type header — the browser sends text/plain, which is a simple request.
      redirect: 'follow',
    });
    if (!res.ok) throw new Error("Server responded " + res.status);
    let body = {};
    try { body = await res.json(); } catch(e) { /* if the server returns non-JSON but 200, treat as ok */ }
    if (body && body.ok === false) throw new Error(body.error || "Server rejected the submission.");

    // Success
    state.submitError = null;
    state.pendingPayload = null;
    state.screen = 'submitted';
    clearLocal();
    render();
  } catch(err) {
    state.submitError = String(err && err.message || err);
    state.screen = 'submit_failed';
    render();
  }
}

function downloadAnswers() {
  const payload = state.pendingPayload;
  if (!payload) { alert("Nothing to download."); return; }
  const text = JSON.stringify(payload, null, 2);
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (payload.studentName || 'student').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  a.href = url;
  a.download = 'exam-' + safeName + '-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ============================================================
   ADMIN — API calls to the webhook
   ============================================================ */
async function apiCall(payload) {
  if (!CONFIG.submitUrl || CONFIG.submitUrl === "PASTE_YOUR_WEBHOOK_URL_HERE") {
    throw new Error("This exam has not been configured. The submit URL is missing.");
  }
  const res = await fetch(CONFIG.submitUrl, {
    method: 'POST',
    body: JSON.stringify(payload),
    redirect: 'follow',
  });
  if (!res.ok) throw new Error('Server responded ' + res.status);
  const body = await res.json();
  return body;
}

async function adminLogin(email, password) {
  const result = await apiCall({ action: 'adminLogin', email, password });
  if (!result.ok) throw new Error(result.error || 'Login failed.');
  state.adminToken = result.token;
  state.adminEmail = result.email;
  try {
    sessionStorage.setItem('mel_admin_token', result.token);
    sessionStorage.setItem('mel_admin_email', result.email);
  } catch(e) {}
  return true;
}

async function adminLogout() {
  const token = state.adminToken;
  state.adminToken = null;
  state.adminEmail = null;
  state.adminSubmissions = [];
  state.adminActive = null;
  try {
    sessionStorage.removeItem('mel_admin_token');
    sessionStorage.removeItem('mel_admin_email');
  } catch(e) {}
  if (token) {
    try { await apiCall({ action: 'logout', token }); } catch(e) { /* ignore */ }
  }
  state.screen = 'admin_login';
  render();
}

async function loadAdminSubmissions() {
  state.adminLoading = true;
  state.adminError = null;
  render();
  try {
    const result = await apiCall({ action: 'listSubmissions', token: state.adminToken });
    if (!result.ok) {
      if (result.authRequired) { adminLogout(); return; }
      throw new Error(result.error);
    }
    state.adminSubmissions = result.submissions || [];
    state.adminLoading = false;
    render();
  } catch(err) {
    state.adminLoading = false;
    state.adminError = String(err && err.message || err);
    render();
  }
}

async function loadAdminSubmission(id) {
  state.adminLoading = true;
  state.adminActive = null;
  state.adminError = null;
  state.screen = 'admin_detail';
  render();
  try {
    const result = await apiCall({ action: 'getSubmission', token: state.adminToken, id });
    if (!result.ok) {
      if (result.authRequired) { adminLogout(); return; }
      throw new Error(result.error);
    }
    state.adminActive = result.submission;
    state.adminLoading = false;
    render();
  } catch(err) {
    state.adminLoading = false;
    state.adminError = String(err && err.message || err);
    render();
  }
}

async function saveAdminMarks(id, scores, notes) {
  const result = await apiCall({ action: 'saveMarks', token: state.adminToken, id, scores, notes });
  if (!result.ok) {
    if (result.authRequired) { adminLogout(); throw new Error('Session expired.'); }
    throw new Error(result.error);
  }
  return result;
}

    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const result = await saveAdminMarks(sub.id, scores, notes);
      // Update in-memory active submission with saved data
      sub.marks = scores;
      sub.notes = notes;
      sub.totalScore = result.totalScore;
      showToast('Marks saved.');
      btn.disabled = false;
      btn.textContent = 'Save marks';
    } catch(err) {
      alert('Save failed: ' + (err && err.message || err));
      btn.disabled = false;
      btn.textContent = 'Save marks';
    }
  });
}

function recomputeAdminTotal() {
  let total = 0;
  QUESTIONS.forEach(q => {
    const sc = document.querySelector('[data-qid="' + q.id + '"][data-role="score"]');
    if (!sc) return;
    const v = sc.value === '' ? null : parseInt(sc.value, 10);
    if (v != null && !isNaN(v) && v >= 0) total += Math.min(v, q.marks);
    // update tag
    const tag = document.querySelector('[data-tag-for="' + q.id + '"]');
    if (tag) {
      const cls = v == null ? '' : (v >= q.marks * 0.75 ? 'good' : v >= q.marks * 0.4 ? 'mid' : 'poor');
      tag.className = 'mark-score-tag ' + cls;
      tag.textContent = (v == null ? '—' : v) + ' / ' + q.marks;
    }
  });
  const totalEl = document.getElementById('a-total');
  if (totalEl && state.adminActive) totalEl.textContent = total + ' / ' + (state.adminActive.maxScore || CONFIG.maxScore);
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ============================================================
   RESUME / BOOT
   ============================================================ */
function maybeResume() {
  const saved = loadLocal();
  if (!saved) return;
  if (saved.screen === 'submitted') return; // don't resume post-submit
  if (saved.startedAt) {
    state.student = saved.student || { name: '', email: '' };
    state.startedAt = saved.startedAt;
    state.answers = saved.answers || {};
    state.flags = saved.flags || {};
    state.currentIdx = saved.currentIdx || 0;
    if (Date.now() - state.startedAt >= CONFIG.durationSec * 1000) {
      // Timer already expired while away
      state.timerExpired = true;
      state.screen = 'exam';
      // Fire auto-submit after boot
      setTimeout(() => autoSubmit(), 200);
    } else {
      state.screen = 'exam';
      startTimer();
    }
  }
}

(async function main() {
  await bootCapabilities();
  // Restore any existing admin session token
  try {
    state.adminToken = sessionStorage.getItem('mel_admin_token') || null;
    state.adminEmail = sessionStorage.getItem('mel_admin_email') || null;
  } catch(e) { /* sessionStorage unavailable — carry on */ }

  const params = new URLSearchParams(location.search);
  if (params.get('admin') === '1') {
    if (state.adminToken) {
      state.screen = 'admin_list';
      render();
      loadAdminSubmissions();
    } else {
      state.screen = 'admin_login';
      render();
    }
    return;
  }
  maybeResume();
  render();
})();
</script>
